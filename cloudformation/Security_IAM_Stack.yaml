AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 2 IAM Stack - Lambda execution roles.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: CloudMart environment name


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # Lambda Authorizer Role
  # ==========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-LambdaAuthorizerRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: LambdaAuthorizerM2Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # CloudWatch Logs - Create Log Group
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: '*'

              # CloudWatch Logs - Create Stream and Write Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-authorizer:*

              # Read authentication token from SSM
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

              # Read JWT secret from SSM
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/jwt-secret


  # ==========================================================
  # Product Lambda Role
  # ==========================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-ProductLambdaRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: ProductLambdaM2Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # CloudWatch Logs - Create Log Group
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: '*'

              # CloudWatch Logs - Create Stream and Write Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-product:*

              # SSM database password
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

              # Lambda VPC networking
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'

              # Publish inventory events to EventBridge
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default


  # ==========================================================
  # Customer Lambda Role
  # ==========================================================

  CustomerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-CustomerLambdaRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: CustomerLambdaM2Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: "*"

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-customer:*

              # SSM database password
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

              # SES email verification
              - Effect: Allow
                Action:
                  - ses:CreateEmailIdentity
                Resource: '*'

              # Lambda VPC networking
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'


  # ==========================================================
  # Login Lambda Role
  # ==========================================================

  LoginLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-LoginLambdaRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: LoginLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # CloudWatch Logs - Create Log Group
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: '*'

              # CloudWatch Logs - Create Stream and Write Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-login:*

              # SSM database password
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

              # SSM JWT secret
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/jwt-secret

              # Lambda VPC networking
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'


  # ==========================================================
  # Order Lambda Role
  # ==========================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-OrderLambdaRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: OrderLambdaM2Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: "*"

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-order:*

              # SSM database password
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

              # Lambda VPC networking
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'

              # SQS order failure queue
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-order-failures

              # EventBridge order events
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

              # CloudWatch custom metrics
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

              # # SNS order confirmation notification
              # - Effect: Allow
              #   Action:
              #     - sns:Publish
              #   Resource: '*'


  # ==========================================================
  # Statistics Lambda Role
  # ==========================================================

  StatisticsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-StatisticsLambdaRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: StatisticsLambdaM2Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: "*"

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-statistics:*


  # ==========================================================
  # EC2 SECURITY GROUP
  # ==========================================================

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudMart EC2 security group

      VpcId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-ec2-sg

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # LAMBDA SECURITY GROUP
  # ==========================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudMart Lambda security group

      VpcId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-VpcId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-sg

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # RDS SECURITY GROUP
  # ==========================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudMart RDS MySQL security group

      VpcId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-sg

        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # Notification Lambda Role
  # ==========================================================

  NotificationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-NotificationLambdaRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: NotificationLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: "*"

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-notification:*
              # SSM database password
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

              # Lambda VPC networking
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'

              # Amazon SES
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SSM VPC Endpoint Security Group
  # ==========================================================

  SSMEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudMart SSM VPC Endpoint security group

      VpcId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-VpcId

      SecurityGroupIngress:

        # Allow HTTPS from CloudMart Lambda Security Group
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref EC2SecurityGroup

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-ssm-endpoint-sg

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SSM Interface VPC Endpoint
  # ==========================================================

  SSMVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-VpcId

      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm

      PrivateDnsEnabled: true

      SubnetIds:
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet1Id
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet2Id

      SecurityGroupIds:
        - !Ref SSMEndpointSecurityGroup

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-ssm-endpoint

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # EventBridge VPC Endpoint Security Group
  # ==========================================================

  EventBridgeEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudMart EventBridge VPC Endpoint security group

      VpcId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-VpcId

      SecurityGroupIngress:

        # Allow HTTPS from CloudMart Lambda Security Group
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-eventbridge-endpoint-sg

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # EventBridge Interface VPC Endpoint
  # ==========================================================

  EventBridgeVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-VpcId

      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.events

      PrivateDnsEnabled: true

      SubnetIds:
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet1Id
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet2Id

      SecurityGroupIds:
        - !Ref EventBridgeEndpointSecurityGroup

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-eventbridge-endpoint

        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # Milestone 5 - EC2 Dashboard Role
  # ==========================================================

  DashboardEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-DashboardEC2Role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:

        - PolicyName: DashboardS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub
                  - '${ReportsBucketArn}/*'
                  - ReportsBucketArn:
                      Fn::ImportValue:
                        !Sub CloudMart-${Environment}-ReportsBucketArn

              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::ImportValue:
                    !Sub CloudMart-${Environment}-ReportsBucketArn


  DashboardEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub CloudMart-${Environment}-DashboardEC2InstanceProfile
      Roles:
        - !Ref DashboardEC2Role

  # ==========================================================
  # Milestone 5 - Dashboard Lambda Role
  # ==========================================================

  DashboardLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-DashboardLambdaRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: DashboardLambdaLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*

        - PolicyName: DashboardLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

        - PolicyName: DashboardLambdaVpcNetworking
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'



        - PolicyName: AlarmNotificationSNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-formatted-monitoring
                



  # ==========================================================
  # Milestone 5 - Daily Report Lambda Role
  # ==========================================================

  DailyReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-DailyReportLambdaRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: DailyReportLambdaLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*

        - PolicyName: DailyReportLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

        - PolicyName: DailyReportS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub
                  - '${ReportsBucketArn}/daily-report-*'
                  - ReportsBucketArn:
                      Fn::ImportValue:
                        !Sub CloudMart-${Environment}-ReportsBucketArn

        - PolicyName: DailyReportLambdaVpcNetworking
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'



  LowStockMetricsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-low-stock-metrics-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchMetricsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
   
       
# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  LambdaAuthorizerRoleArn:
    Description: Lambda Authorizer IAM Role ARN
    Value: !GetAtt LambdaAuthorizerRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-LambdaAuthorizerRoleArn


  ProductLambdaRoleArn:
    Description: Product Lambda IAM Role ARN
    Value: !GetAtt ProductLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaRoleArn


  CustomerLambdaRoleArn:
    Description: Customer Lambda IAM Role ARN
    Value: !GetAtt CustomerLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-CustomerLambdaRoleArn


  LoginLambdaRoleArn:
    Description: Login Lambda IAM Role ARN
    Value: !GetAtt LoginLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-LoginLambdaRoleArn


  OrderLambdaRoleArn:
    Description: Order Lambda IAM Role ARN
    Value: !GetAtt OrderLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-OrderLambdaRoleArn


  StatisticsLambdaRoleArn:
    Description: Statistics Lambda IAM Role ARN
    Value: !GetAtt StatisticsLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-StatisticsLambdaRoleArn


  EC2SecurityGroupId:
    Description: CloudMart EC2 Security Group ID
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-EC2SecurityGroupId


  LambdaSecurityGroupId:
    Description: CloudMart Lambda Security Group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-LambdaSecurityGroupId


  RDSSecurityGroupId:
    Description: CloudMart RDS Security Group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-RDSSecurityGroupId


  SSMEndpointSecurityGroupId:
    Description: CloudMart SSM VPC Endpoint Security Group ID
    Value: !Ref SSMEndpointSecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-SSMEndpointSecurityGroupId


  EventBridgeEndpointSecurityGroupId:
    Description: CloudMart EventBridge VPC Endpoint Security Group ID
    Value: !Ref EventBridgeEndpointSecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-EventBridgeEndpointSecurityGroupId


  SSMVpcEndpointId:
    Description: CloudMart SSM VPC Interface Endpoint ID
    Value: !Ref SSMVpcEndpoint
    Export:
      Name: !Sub CloudMart-${Environment}-SSMVpcEndpointId


  EventBridgeVpcEndpointId:
    Description: CloudMart EventBridge VPC Interface Endpoint ID
    Value: !Ref EventBridgeVpcEndpoint
    Export:
      Name: !Sub CloudMart-${Environment}-EventBridgeVpcEndpointId


  NotificationLambdaRoleArn:
    Description: Notification Lambda IAM Role ARN
    Value: !GetAtt NotificationLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-NotificationLambdaRoleArn


  DashboardEC2RoleArn:
    Description: Milestone 5 EC2 Dashboard IAM Role ARN
    Value: !GetAtt DashboardEC2Role.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-DashboardEC2RoleArn

  DashboardEC2InstanceProfileName:
    Description: Milestone 5 EC2 Dashboard Instance Profile Name
    Value: !Ref DashboardEC2InstanceProfile
    Export:
      Name: !Sub CloudMart-${Environment}-DashboardEC2InstanceProfileName

  DashboardLambdaRoleArn:
    Description: Milestone 5 Dashboard Lambda IAM Role ARN
    Value: !GetAtt DashboardLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-DashboardLambdaRoleArn


  DailyReportLambdaRoleArn:
    Description: Milestone 5 Daily Report Lambda IAM Role ARN
    Value: !GetAtt DailyReportLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-DailyReportLambdaRoleArn



  LowStockMetricsLambdaRoleArn:
    Description: IAM role ARN for LowStockEvents metrics Lambda
    Value: !GetAtt LowStockMetricsLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-LowStockMetricsLambdaRoleArn