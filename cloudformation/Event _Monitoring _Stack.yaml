AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Milestone 5 Monitoring Stack.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  NotificationEmail:
    Type: String
    Description: Email address for CloudWatch alarm notifications

Resources:

  MonitoringTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-monitoring
      Tags:
        - Key: Environment
          Value: !Ref Environment


  FormattedMonitoringTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-formatted-monitoring
      Tags:
        - Key: Environment
          Value: !Ref Environment


  FormattedMonitoringEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FormattedMonitoringTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail


  AlarmNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref MonitoringTopic
      Protocol: lambda
      Endpoint:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-AlarmNotificationLambdaArn


  AlarmNotificationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-AlarmNotificationLambdaArn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref MonitoringTopic


  LowStockEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-low-stock-events
      AlarmDescription: Alarm when more than 0 low-stock events occur within 5 minutes
      Namespace: CloudMart/Operations
      MetricName: LowStockEvents
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringTopic


  OrdersFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-orders-failed
      AlarmDescription: Alarm when one or more orders fail within 5 minutes
      Namespace: CloudMart/Operations
      MetricName: OrdersFailed
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringTopic


  OrderLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-order-lambda-errors
      AlarmDescription: Alarm when the Order Lambda has execution errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-order
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringTopic


  ProductLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-product-lambda-errors
      AlarmDescription: Alarm when the Product Lambda has execution errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-product
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringTopic


  RDSCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-rds-cpu
      AlarmDescription: Alarm when RDS CPU utilization is high
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: cloudmart-dev-mysql
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringTopic


  ApiGateway5xxErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-api-gateway-5xx-errors
      AlarmDescription: Alarm when API Gateway returns 5XX errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: 0h8szqn3r5
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringTopic


  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub cloudmart-${Environment}-operations
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Orders Placed",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "metrics": [
                  [
                    "CloudMart/Operations",
                    "OrdersPlaced",
                    "Environment",
                    "${Environment}",
                    {
                      "stat": "Sum",
                      "label": "OrdersPlaced",
                      "color": "#1f77b4"
                    }
                  ],
                  [
                    "CloudMart/Operations",
                    "OrdersPlacedLatency",
                    "Environment",
                    "${Environment}",
                    {
                      "stat": "Average",
                      "label": "Latency (ms)",
                      "color": "#ff7f0e"
                    }
                  ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Orders Failed",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "metrics": [
                  [
                    "CloudMart/Operations",
                    "OrdersFailed",
                    "Environment",
                    "${Environment}",
                    {
                      "stat": "Sum",
                      "label": "OrdersFailed",
                      "color": "#1f77b4"
                    }
                  ],
                  [
                    "CloudMart/Operations",
                    "OrdersFailedLatency",
                    "Environment",
                    "${Environment}",
                    {
                      "stat": "Average",
                      "label": "Latency (ms)",
                      "color": "#ff7f0e"
                    }
                  ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Low Stock Events",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "metrics": [
                  [
                    "CloudMart/Operations",
                    "LowStockEvents",
                    "Environment",
                    "${Environment}",
                    {
                      "stat": "Sum",
                      "label": "LowStockEvents",
                      "color": "#1f77b4"
                    }
                  ],
                  [
                    "CloudMart/Operations",
                    "LowStockEventsLatency",
                    "Environment",
                    "${Environment}",
                    {
                      "stat": "Average",
                      "label": "Latency (ms)",
                      "color": "#ff7f0e"
                    }
                  ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "API Gateway Invocations",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 86400,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Count",
                    "ApiId",
                    "0h8szqn3r5"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "API Gateway Errors (4XX + 5XX)",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "4xx",
                    "ApiId",
                    "0h8szqn3r5"
                  ],
                  [
                    "AWS/ApiGateway",
                    "5xx",
                    "ApiId",
                    "0h8szqn3r5"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Order Lambda Errors",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "cloudmart-${Environment}-order"
                  ]
                ],
                "stat": "Sum",
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Product Lambda Errors",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "cloudmart-${Environment}-product"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "RDS CPU Utilization",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "metrics": [
                  [
                    "AWS/RDS",
                    "CPUUtilization",
                    "DBInstanceIdentifier",
                    "cloudmart-dev-mysql"
                  ]
                ],
                "stat": "Average",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EC2 Network In",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "metrics": [
                  [
                    "AWS/EC2",
                    "NetworkIn",
                    "InstanceId",
                    "i-0aaf6168396487377"
                  ]
                ],
                "stat": "Sum",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EC2 Network Out",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "metrics": [
                  [
                    "AWS/EC2",
                    "NetworkOut",
                    "InstanceId",
                    "i-0aaf6168396487377"
                  ]
                ],
                "stat": "Sum",
                "period": 300
              }
            }
          ]
        }


Outputs:

  FormattedMonitoringTopicArn:
    Description: ARN of the SNS topic used for formatted CloudMart alarm notifications
    Value: !Ref FormattedMonitoringTopic
    Export:
      Name: !Sub CloudMart-${Environment}-FormattedMonitoringTopicArn