AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 5 EC2 Dashboard Stack.

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
    Description: CloudMart environment name

Resources:

  # ==========================================================
  # Flask session secret (generated and stored by AWS)
  # ==========================================================

  FlaskSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub cloudmart-${Environment}-flask-secret
      Description: !Sub Flask session secret for CloudMart ${Environment} dashboard
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ==========================================================
  # Milestone 5 Dashboard EC2
  # ==========================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:

      InstanceType: t3.micro

      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'

      IamInstanceProfile:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-DashboardEC2InstanceProfileName

      SubnetId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-PublicSubnetId

      SecurityGroupIds:
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-EC2SecurityGroupId

      UserData:
        Fn::Base64:
          !Sub
            - |
              #!/bin/bash
              set -e

              dnf install -y python3 python3-pip nginx awscli

              mkdir -p /opt/cloudmart-dashboard/templates
              chown -R ec2-user:ec2-user /opt/cloudmart-dashboard

              python3 -m venv /opt/cloudmart-dashboard/venv
              /opt/cloudmart-dashboard/venv/bin/pip install --upgrade pip
              /opt/cloudmart-dashboard/venv/bin/pip install flask requests boto3

              FLASK_SECRET_KEY=$(aws secretsmanager get-secret-value \
                --secret-id '${FlaskSecret}' \
                --query SecretString \
                --output text)

              if [ -z "$FLASK_SECRET_KEY" ] || [ "$FLASK_SECRET_KEY" = "None" ]; then
                echo "Unable to retrieve Flask secret from Secrets Manager" >&2
                exit 1
              fi

              umask 077
              cat > /etc/cloudmart-dashboard.env <<ENVEOF
              API_URL=${ApiUrl}
              REPORTS_BUCKET=cloudmart-${Environment}-reports-${AWS::AccountId}
              FLASK_SECRET_KEY=$FLASK_SECRET_KEY
              ENVEOF
              chmod 600 /etc/cloudmart-dashboard.env
              unset FLASK_SECRET_KEY

              cat > /etc/systemd/system/cloudmart-dashboard.service <<'SERVICEEOF'
              [Unit]
              Description=CloudMart Flask Dashboard
              After=network-online.target
              Wants=network-online.target

              [Service]
              User=ec2-user
              Group=ec2-user
              WorkingDirectory=/opt/cloudmart-dashboard
              EnvironmentFile=/etc/cloudmart-dashboard.env
              ExecStart=/opt/cloudmart-dashboard/venv/bin/python /opt/cloudmart-dashboard/app.py
              Restart=always
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
              SERVICEEOF

              cat > /etc/nginx/conf.d/cloudmart-dashboard.conf <<'NGINXEOF'
              server {
                  listen 80;
                  server_name _;

                  location / {
                      proxy_pass http://127.0.0.1:8000;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
              }
              NGINXEOF

              rm -f /etc/nginx/conf.d/default.conf

              systemctl daemon-reload
              systemctl enable nginx
              systemctl restart nginx
              systemctl enable cloudmart-dashboard

              touch /var/lib/cloudmart-dashboard-setup-complete
            - ApiUrl:
                Fn::ImportValue:
                  !Sub CloudMart-${Environment}-ApiUrl

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-Dashboard

        - Key: Environment
          Value: !Ref Environment


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  DashboardEC2InstanceId:
    Description: Milestone 5 Dashboard EC2 Instance ID
    Value: !Ref DashboardEC2
    Export:
      Name: !Sub CloudMart-${Environment}-DashboardEC2InstanceId


  DashboardEC2PublicIp:
    Description: Milestone 5 Dashboard EC2 Public IP
    Value: !GetAtt DashboardEC2.PublicIp
    Export:
      Name: !Sub CloudMart-${Environment}-DashboardEC2PublicIp
