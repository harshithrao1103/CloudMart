AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 2 Data Stack - RDS MySQL,
  DB subnet group, S3 bucket, and SSM integration.


Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: CloudMart environment name

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name

  DBUsername:
    Type: String
    Default: admin
    Description: RDS master username

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDS master password

  AuthToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: CloudMart API authentication token


Resources:

  # ==================================================
  # RDS DB SUBNET GROUP
  # ==================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CloudMart RDS DB subnet group

      SubnetIds:
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet1Id

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet2Id

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-db-subnet-group

        - Key: Environment
          Value: !Ref Environment


  # ==================================================
  # RDS MYSQL INSTANCE
  # ==================================================

  CloudMartRDS:
    Type: AWS::RDS::DBInstance
    Properties:

      DBInstanceIdentifier:
        !Sub cloudmart-${Environment}-mysql

      Engine: mysql

      DBName: !Ref DBName

      MasterUsername: !Ref DBUsername

      # Password is stored in SSM Parameter Store
      # as a SecureString and retrieved securely.
      MasterUserPassword: !Sub
        - '{{resolve:ssm-secure:${PasswordParameterName}}}'
        - PasswordParameterName: !Sub /cloudmart/${Environment}/db/password

      DBInstanceClass: db.t3.micro

      AllocatedStorage: 20

      StorageType: gp3

      PubliclyAccessible: false

      MultiAZ: false

      DBSubnetGroupName: !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RDSSecurityGroupId

      BackupRetentionPeriod: 1

      DeletionProtection: false

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-mysql

        - Key: Environment
          Value: !Ref Environment


  # ==================================================
  # S3 REPORTS BUCKET
  # ==================================================

  CloudMartReportsBucket:
    Type: AWS::S3::Bucket
    Properties:

      BucketName:
        !Sub cloudmart-${Environment}-reports-${AWS::AccountId}

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports

        - Key: Environment
          Value: !Ref Environment


# ====================================================
# OUTPUTS
# ====================================================

Outputs:

  # --------------------------------------------------
  # RDS INSTANCE
  # --------------------------------------------------

  RDSInstanceIdentifier:
    Description: CloudMart RDS instance identifier
    Value: !Ref CloudMartRDS
    Export:
      Name: !Sub CloudMart-${Environment}-RDSInstanceIdentifier


  # --------------------------------------------------
  # RDS ENDPOINT
  # --------------------------------------------------

  RDSEndpoint:
    Description: CloudMart RDS endpoint
    Value: !GetAtt CloudMartRDS.Endpoint.Address
    Export:
      Name: !Sub CloudMart-${Environment}-RDSEndpoint


  # --------------------------------------------------
  # RDS PORT
  # --------------------------------------------------

  RDSPort:
    Description: CloudMart RDS MySQL port
    Value: !GetAtt CloudMartRDS.Endpoint.Port
    Export:
      Name: !Sub CloudMart-${Environment}-RDSPort


  # --------------------------------------------------
  # DB SUBNET GROUP
  # --------------------------------------------------

  DBSubnetGroupName:
    Description: CloudMart RDS DB subnet group
    Value: !Ref CloudMartDBSubnetGroup
    Export:
      Name: !Sub CloudMart-${Environment}-DBSubnetGroupName


  # --------------------------------------------------
  # S3 BUCKET
  # --------------------------------------------------

  ReportsBucketName:
    Description: CloudMart S3 reports bucket
    Value: !Ref CloudMartReportsBucket
    Export:
      Name: !Sub CloudMart-${Environment}-ReportsBucketName


  ReportsBucketArn:
    Description: CloudMart S3 reports bucket ARN
    Value: !GetAtt CloudMartReportsBucket.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ReportsBucketArn