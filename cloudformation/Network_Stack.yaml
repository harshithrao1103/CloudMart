AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Network Stack - VPC, public and private subnets,
  Internet Gateway, and route tables.


Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: CloudMart environment name

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the CloudMart VPC

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for the public subnet

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for the first private subnet

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for the second private subnet


Resources:

  # --------------------------------------------------
  # VPC
  # --------------------------------------------------

  CloudMartVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc
        - Key: Environment
          Value: !Ref Environment


  # --------------------------------------------------
  # Internet Gateway
  # --------------------------------------------------

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-igw
        - Key: Environment
          Value: !Ref Environment


  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  # --------------------------------------------------
  # Public Subnet
  # --------------------------------------------------

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref AWS::Region
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-subnet
        - Key: Tier
          Value: Public
        - Key: Environment
          Value: !Ref Environment


  # --------------------------------------------------
  # Private Subnet 1
  # --------------------------------------------------

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref AWS::Region
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet-1
        - Key: Tier
          Value: Private
        - Key: Environment
          Value: !Ref Environment


  # --------------------------------------------------
  # Private Subnet 2
  # --------------------------------------------------

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: !Ref AWS::Region
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet-2
        - Key: Tier
          Value: Private
        - Key: Environment
          Value: !Ref Environment


  # --------------------------------------------------
  # Public Route Table
  # --------------------------------------------------

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudMartVPC
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-rt
        - Key: Environment
          Value: !Ref Environment


  # --------------------------------------------------
  # SSM VPC Endpoint Security Group
  # --------------------------------------------------

  SSMEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudMart SSM VPC Endpoint security group
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId:
            Fn::ImportValue:
              !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-ssm-endpoint-sg
        - Key: Environment
          Value: !Ref Environment



  # --------------------------------------------------
  # SSM Interface VPC Endpoint
  # --------------------------------------------------

  SSMVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref SSMEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-ssm-endpoint
        - Key: Environment
          Value: !Ref Environment


  # --------------------------------------------------
  # Public Route to Internet Gateway
  # --------------------------------------------------

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  # --------------------------------------------------
  # Public Subnet Route Table Association
  # --------------------------------------------------

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable


  # --------------------------------------------------
  # Private Route Table
  # --------------------------------------------------

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudMartVPC
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-rt
        - Key: Environment
          Value: !Ref Environment


  # --------------------------------------------------
  # Private Subnet 1 Route Table Association
  # --------------------------------------------------

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable


  # --------------------------------------------------
  # Private Subnet 2 Route Table Association
  # --------------------------------------------------

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable


# ----------------------------------------------------
# Outputs
# ----------------------------------------------------

Outputs:

  VpcId:
    Description: CloudMart VPC ID
    Value: !Ref CloudMartVPC
    Export:
      Name: !Sub CloudMart-${Environment}-VpcId


  PublicSubnetId:
    Description: CloudMart Public Subnet ID
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub CloudMart-${Environment}-PublicSubnetId


  PrivateSubnet1Id:
    Description: CloudMart Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub CloudMart-${Environment}-PrivateSubnet1Id


  PrivateSubnet2Id:
    Description: CloudMart Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub CloudMart-${Environment}-PrivateSubnet2Id


  PublicRouteTableId:
    Description: CloudMart Public Route Table ID
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub CloudMart-${Environment}-PublicRouteTableId


  PrivateRouteTableId:
    Description: CloudMart Private Route Table ID
    Value: !Ref PrivateRouteTable
    Export:
      Name: !Sub CloudMart-${Environment}-PrivateRouteTableId


  SSMVpcEndpointId:
    Description: CloudMart SSM VPC Interface Endpoint ID
    Value: !Ref SSMVpcEndpoint
    Export:
      Name: !Sub CloudMart-${Environment}-SSMVpcEndpointId