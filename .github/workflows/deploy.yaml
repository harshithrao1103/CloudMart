name: CloudMart Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ==================================================
  # NETWORK STACK
  # ==================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Network_Stack.yaml

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-network-dev \
            --template-file cloudformation/Network_Stack.yaml \
            --parameter-overrides Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM


  # ==================================================
  # SECURITY AND IAM STACK
  # ==================================================

  deploy-security-iam:
    name: Deploy Security and IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Security IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Security_IAM_Stack.yaml

      - name: Deploy Security and IAM Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-security-iam-dev \
            --template-file cloudformation/Security_IAM_Stack.yaml \
            --parameter-overrides Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM


  # ==================================================
  # DATA / STORAGE STACK
  # ==================================================

  deploy-data:
    name: Deploy Data Storage Stack
    runs-on: ubuntu-latest
    needs: deploy-security-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Data Stack File
        run: |
          echo "Current commit:"
          git rev-parse HEAD

          echo "CloudFormation files:"
          git ls-files cloudformation

          echo "Storage Data Stack:"
          ls -la cloudformation/Storage_Database_Stack.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ------------------------------------------------
      # Create SSM SecureString parameters
      # ------------------------------------------------

      - name: Create SSM SecureString Parameters
        run: |
          aws ssm put-parameter \
            --name "/cloudmart/dev/db/password" \
            --value "${{ secrets.DB_PASSWORD }}" \
            --type SecureString \
            --overwrite

          aws ssm put-parameter \
            --name "/cloudmart/dev/auth/token" \
            --value "${{ secrets.AUTH_TOKEN }}" \
            --type SecureString \
            --overwrite

      # ------------------------------------------------
      # Validate Data Storage Stack
      # ------------------------------------------------

      - name: Validate Data Storage Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Storage_Database_Stack.yaml

      # ------------------------------------------------
      # Deploy Data Storage Stack
      # ------------------------------------------------

      - name: Deploy Data Storage Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-data-dev \
            --template-file cloudformation/Storage_Database_Stack.yaml \
            --parameter-overrides \
              Environment=dev \
              DBName=cloudmart \
              DBUsername=admin \
              DBPassword="${{ secrets.DB_PASSWORD }}" \
              AuthToken="${{ secrets.AUTH_TOKEN }}" \
            --capabilities CAPABILITY_NAMED_IAM


  # ==================================================
  # APPLICATION STACK - MILESTONE 4
  # ==================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------
      # Configure AWS
      # ------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ------------------------------------------------
      # Install AWS SAM CLI
      # ------------------------------------------------

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      # ------------------------------------------------
      # Validate SAM template
      # ------------------------------------------------

      - name: Validate SAM Application Stack
        run: |
          sam validate \
            --template-file cloudformation/Application_Stack.yaml

      # ------------------------------------------------
      # Build SAM application
      # ------------------------------------------------

      - name: Build SAM Application
        run: |
          sam build \
            --template-file cloudformation/Application_Stack.yaml

      # ------------------------------------------------
      # Deploy SAM application
      # ------------------------------------------------

      - name: Deploy SAM Application
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-application-dev \
            --s3-bucket cloudmart-dev-sam-artifacts-598886663370 \
            --on-failure DO_NOTHING \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment=dev \
              NotificationEmail="${{ secrets.NOTIFICATION_EMAIL }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset