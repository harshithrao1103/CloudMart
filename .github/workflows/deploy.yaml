name: CloudMart Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Network_Stack.yaml

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-network-dev \
            --template-file cloudformation/Network_Stack.yaml \
            --parameter-overrides Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM


  deploy-security-iam:
    name: Deploy Security and IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: us-east-1

      - name: Validate Security IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Security_IAM%20Stack.yaml

      - name: Deploy Security IAM Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-security-iam-dev \
            --template-file "cloudformation/Security_IAM Stack.yaml" \
            --parameter-overrides Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM