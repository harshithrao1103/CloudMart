name: CloudMart Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # ==================================================
  # LOAD CONFIGURATION
  # ==================================================

  load-config:
    name: Load CloudMart Configuration
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.config.outputs.environment }}
      vpc_cidr: ${{ steps.config.outputs.vpc_cidr }}
      public_subnet_cidr: ${{ steps.config.outputs.public_subnet_cidr }}
      private_subnet1_cidr: ${{ steps.config.outputs.private_subnet1_cidr }}
      private_subnet2_cidr: ${{ steps.config.outputs.private_subnet2_cidr }}
      db_name: ${{ steps.config.outputs.db_name }}
      db_username: ${{ steps.config.outputs.db_username }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load configuration
        id: config
        shell: bash
        run: |
          echo "environment=$(jq -r '.Environment' config.json)" >> "$GITHUB_OUTPUT"
          echo "vpc_cidr=$(jq -r '.VpcCidr' config.json)" >> "$GITHUB_OUTPUT"
          echo "public_subnet_cidr=$(jq -r '.PublicSubnetCidr' config.json)" >> "$GITHUB_OUTPUT"
          echo "private_subnet1_cidr=$(jq -r '.PrivateSubnet1Cidr' config.json)" >> "$GITHUB_OUTPUT"
          echo "private_subnet2_cidr=$(jq -r '.PrivateSubnet2Cidr' config.json)" >> "$GITHUB_OUTPUT"
          echo "db_name=$(jq -r '.DBName' config.json)" >> "$GITHUB_OUTPUT"
          echo "db_username=$(jq -r '.DBUsername' config.json)" >> "$GITHUB_OUTPUT"


  # ==================================================
  # NETWORK STACK
  # ==================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: load-config

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update GitHub Actions IAM Policy
        run: |
          aws iam put-role-policy \
            --role-name CloudMart-GitHubActions-Role \
            --policy-name CloudMartGitHubActionsDeployment \
            --policy-document file://github-actions-policy.json

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Network_Stack.yaml

      - name: Deploy Network Stack
        env:
          CF_ENVIRONMENT: ${{ needs.load-config.outputs.environment }}
          VPC_CIDR: ${{ needs.load-config.outputs.vpc_cidr }}
          PUBLIC_SUBNET_CIDR: ${{ needs.load-config.outputs.public_subnet_cidr }}
          PRIVATE_SUBNET1_CIDR: ${{ needs.load-config.outputs.private_subnet1_cidr }}
          PRIVATE_SUBNET2_CIDR: ${{ needs.load-config.outputs.private_subnet2_cidr }}
        run: |
          aws cloudformation deploy \
            --stack-name "cloudmart-network-${CF_ENVIRONMENT}" \
            --template-file cloudformation/Network_Stack.yaml \
            --parameter-overrides \
              Environment="$CF_ENVIRONMENT" \
              VpcCidr="$VPC_CIDR" \
              PublicSubnetCidr="$PUBLIC_SUBNET_CIDR" \
              PrivateSubnet1Cidr="$PRIVATE_SUBNET1_CIDR" \
              PrivateSubnet2Cidr="$PRIVATE_SUBNET2_CIDR" \
            --capabilities CAPABILITY_NAMED_IAM


  # ==================================================
  # SECURITY AND IAM
  # ==================================================

  deploy-security-iam:
    name: Deploy Security and IAM Stack
    runs-on: ubuntu-latest
    needs:
      - load-config
      - deploy-network

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Security IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Security_IAM_Stack.yaml

      - name: Deploy Security and IAM Stack
        env:
          CF_ENVIRONMENT: ${{ needs.load-config.outputs.environment }}
        run: |
          aws cloudformation deploy \
            --stack-name "cloudmart-security-iam-${CF_ENVIRONMENT}" \
            --template-file cloudformation/Security_IAM_Stack.yaml \
            --parameter-overrides \
              Environment="$CF_ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM


  # ==================================================
  # DATA / STORAGE
  # ==================================================

  deploy-data:
    name: Deploy Data Storage Stack
    runs-on: ubuntu-latest
    needs:
      - load-config
      - deploy-security-iam

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Data Storage Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Storage_Database_Stack.yaml

      - name: Deploy Data Storage Stack
        env:
          CF_ENVIRONMENT: ${{ needs.load-config.outputs.environment }}
          DB_NAME: ${{ needs.load-config.outputs.db_name }}
          DB_USERNAME: ${{ needs.load-config.outputs.db_username }}
        run: |
          aws cloudformation deploy \
            --stack-name "cloudmart-data-${CF_ENVIRONMENT}" \
            --template-file cloudformation/Storage_Database_Stack.yaml \
            --parameter-overrides \
              Environment="$CF_ENVIRONMENT" \
              DBName="$DB_NAME" \
              DBUsername="$DB_USERNAME" \
              DBPassword="${{ secrets.DB_PASSWORD }}" \
              AuthToken="${{ secrets.AUTH_TOKEN }}" \
              JWTSecret="${{ secrets.JWT_SECRET }}" \
            --capabilities CAPABILITY_NAMED_IAM


  # ==================================================
  # APPLICATION STACK
  # ==================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs:
      - load-config
      - deploy-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SAM CLI
        run: |
          sam --version
          sam --info


      - name: Validate SAM Application Stack
        run: |
          sam validate \
            --template-file cloudformation/Application_Stack.yaml

      - name: Prepare Database Schema
        run: |
          cp database/schema.sql lambda/db_init/schema.sql

      - name: Build SAM Application
        run: |
          sam build \
            --template-file cloudformation/Application_Stack.yaml

      - name: Ensure SAM Artifact Bucket Exists
        env:
          CF_ENVIRONMENT: ${{ needs.load-config.outputs.environment }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          BUCKET_NAME="cloudmart-${CF_ENVIRONMENT}-sam-artifacts-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "SAM artifact bucket already exists."
          else
            echo "Creating SAM artifact bucket..."
            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region "${AWS_REGION}"
          fi

      - name: Deploy SAM Application
        env:
          CF_ENVIRONMENT: ${{ needs.load-config.outputs.environment }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          BUCKET_NAME="cloudmart-${CF_ENVIRONMENT}-sam-artifacts-${ACCOUNT_ID}"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "cloudmart-application-${CF_ENVIRONMENT}" \
            --s3-bucket "$BUCKET_NAME" \
            --region "${AWS_REGION}" \
            --on-failure DO_NOTHING \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment="$CF_ENVIRONMENT" \
              NotificationEmail="${{ secrets.NOTIFICATION_EMAIL }}" \
              SenderEmail="${{ secrets.SENDER_EMAIL }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Wait for RDS
        env:
          CF_ENVIRONMENT: ${{ needs.load-config.outputs.environment }}
        run: |
          aws rds wait db-instance-available \
            --db-instance-identifier "cloudmart-${CF_ENVIRONMENT}-mysql"

      - name: Initialize Database
        env:
          CF_ENVIRONMENT: ${{ needs.load-config.outputs.environment }}
        run: |
          aws lambda invoke \
            --function-name "cloudmart-${CF_ENVIRONMENT}-db-init" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            db-init-response.json

          cat db-init-response.json


  # ==================================================
  # EC2 INFRASTRUCTURE
  # ==================================================

  deploy-ec2-infrastructure:
    name: Deploy EC2 Dashboard Infrastructure
    runs-on: ubuntu-latest
    needs:
      - load-config
      - deploy-application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate EC2 Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Milestone5_EC2_Stack.yaml

      - name: Deploy EC2 Dashboard Infrastructure
        env:
          CF_ENVIRONMENT: ${{ needs.load-config.outputs.environment }}
        run: |
          aws cloudformation deploy \
            --stack-name "cloudmart-milestone5-ec2-${CF_ENVIRONMENT}" \
            --template-file cloudformation/Milestone5_EC2_Stack.yaml \
            --parameter-overrides \
              Environment="$CF_ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


  # ==================================================
  # MONITORING
  # ==================================================

  deploy-monitoring:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest
    needs:
      - load-config
      - deploy-ec2-infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Monitoring Stack
        run: |
          aws cloudformation validate-template \
            --template-body "file://cloudformation/Event _Monitoring _Stack.yaml"

      - name: Deploy Monitoring Stack
        env:
          CF_ENVIRONMENT: ${{ needs.load-config.outputs.environment }}
        run: |
          aws cloudformation deploy \
            --stack-name "cloudmart-monitoring-${CF_ENVIRONMENT}" \
            --template-file "cloudformation/Event _Monitoring _Stack.yaml" \
            --parameter-overrides \
              Environment="$CF_ENVIRONMENT" \
              NotificationEmail="${{ secrets.NOTIFICATION_EMAIL }}" \
            --no-fail-on-empty-changeset


  # ==================================================
  # EC2 DASHBOARD APPLICATION
  # ==================================================

  deploy-ec2-dashboard:
    name: Deploy EC2 Dashboard Application
    runs-on: ubuntu-latest
    needs:
      - load-config
      - deploy-monitoring

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Get Dashboard EC2 Instance ID
        id: get-ec2-id
        env:
          CF_ENVIRONMENT: ${{ needs.load-config.outputs.environment }}
        run: |
          EC2_INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "cloudmart-milestone5-ec2-${CF_ENVIRONMENT}" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardEC2InstanceId'].OutputValue" \
            --output text)

          echo "EC2_INSTANCE_ID=$EC2_INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Wait for EC2 SSM
        run: |
          echo "Waiting for EC2 instance to become available through SSM..."

          for i in {1..30}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "EC2 is online in SSM."
              exit 0
            fi

            sleep 10
          done

          echo "EC2 did not become available through SSM."
          exit 1

      - name: Wait for EC2 Dashboard Bootstrap
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "for i in {1..30}; do if [ -f /var/lib/cloudmart-dashboard-setup-complete ]; then exit 0; fi; sleep 10; done; exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Deploy Dashboard to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p /opt/cloudmart-dashboard/templates",
              "curl -L -o /opt/cloudmart-dashboard/app.py https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/dashboard/app.py",
              "curl -L -o /opt/cloudmart-dashboard/templates/dashboard.html https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/dashboard/templates/dashboard.html",
              "curl -L -o /opt/cloudmart-dashboard/templates/login.html https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/dashboard/templates/login.html",
              "chown -R ec2-user:ec2-user /opt/cloudmart-dashboard",
              "systemctl restart cloudmart-dashboard",
              "systemctl restart nginx",
              "systemctl is-active cloudmart-dashboard",
              "systemctl is-active nginx"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json