name: CloudMart Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select CloudMart environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # ==================================================
  # NETWORK STACK
  # ==================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Network_Stack.yaml

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-network-${{ inputs.environment }} \
            --template-file cloudformation/Network_Stack.yaml \
            --parameter-overrides Environment=${{ inputs.environment }} \
            --capabilities CAPABILITY_NAMED_IAM


  # ==================================================
  # SECURITY AND IAM STACK
  # ==================================================

  deploy-security-iam:
    name: Deploy Security and IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Security IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Security_IAM_Stack.yaml

      - name: Deploy Security and IAM Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-security-iam-${{ inputs.environment }} \
            --template-file cloudformation/Security_IAM_Stack.yaml \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              SenderEmail="${{ secrets.SENDER_EMAIL }}" \
            --capabilities CAPABILITY_NAMED_IAM


  # ==================================================
  # DATA / STORAGE STACK
  # ==================================================

  deploy-data:
    name: Deploy Data Storage Stack
    runs-on: ubuntu-latest
    needs: deploy-security-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Data Stack File
        run: |
          echo "Current commit:"
          git rev-parse HEAD

          echo "CloudFormation files:"
          git ls-files cloudformation

          echo "Storage Data Stack:"
          ls -la cloudformation/Storage_Database_Stack.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Data Storage Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Storage_Database_Stack.yaml

      - name: Deploy Data Storage Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-data-${{ inputs.environment }} \
            --template-file cloudformation/Storage_Database_Stack.yaml \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              DBName=cloudmart \
              DBUsername=admin \
              DBPassword="${{ secrets.DB_PASSWORD }}" \
              AuthToken="${{ secrets.AUTH_TOKEN }}" \
              JWTSecret="${{ secrets.JWT_SECRET }}" \
            --capabilities CAPABILITY_NAMED_IAM


  # ==================================================
  # APPLICATION STACK - MILESTONE 4
  # ==================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM Application Stack
        run: |
          sam validate \
            --template-file cloudformation/Application_Stack.yaml

      # ------------------------------------------------
      # Prepare Database Initialization Lambda
      # ------------------------------------------------

      - name: Prepare Database Schema
        run: |
          cp database/schema.sql lambda/db_init/schema.sql

      # ------------------------------------------------
      # Build SAM application
      # ------------------------------------------------

      - name: Build SAM Application
        run: |
          sam build \
            --template-file cloudformation/Application_Stack.yaml

      # ------------------------------------------------
      # Create / Verify SAM Artifact Bucket
      # ------------------------------------------------

      - name: Ensure SAM Artifact Bucket Exists
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          BUCKET_NAME="cloudmart-${{ inputs.environment }}-sam-artifacts-${ACCOUNT_ID}"

          echo "SAM artifact bucket: $BUCKET_NAME"

          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket already exists."
          else
            echo "Creating bucket..."

            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region "${{ env.AWS_REGION }}"
          fi

      # ------------------------------------------------
      # Deploy SAM Application
      # ------------------------------------------------

      - name: Deploy SAM Application
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          BUCKET_NAME="cloudmart-${{ inputs.environment }}-sam-artifacts-${ACCOUNT_ID}"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-application-${{ inputs.environment }} \
            --s3-bucket "$BUCKET_NAME" \
            --region "${{ env.AWS_REGION }}" \
            --on-failure DO_NOTHING \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              NotificationEmail="${{ secrets.NOTIFICATION_EMAIL }}" \
              SenderEmail="${{ secrets.SENDER_EMAIL }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # ------------------------------------------------
      # Wait for RDS
      # ------------------------------------------------

      - name: Wait for RDS
        run: |
          aws rds wait db-instance-available \
            --db-instance-identifier cloudmart-${{ inputs.environment }}-mysql

      # ------------------------------------------------
      # Initialize Database
      # ------------------------------------------------

      - name: Initialize Database
        run: |

          aws lambda invoke \
            --function-name cloudmart-${{ inputs.environment }}-db-init \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            db-init-response.json

          cat db-init-response.json


  # ==================================================
  # EC2 INFRASTRUCTURE - MILESTONE 5
  # ==================================================

  deploy-ec2-infrastructure:
    name: Deploy EC2 Dashboard Infrastructure
    runs-on: ubuntu-latest
    needs: deploy-application

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate EC2 Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Milestone5_EC2_Stack.yaml

      - name: Deploy EC2 Dashboard Infrastructure
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-ec2-dashboard-${{ inputs.environment }} \
            --template-file cloudformation/Milestone5_EC2_Stack.yaml \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


  # ==================================================
  # MONITORING STACK - MILESTONE 5
  # ==================================================

  deploy-monitoring:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest
    needs: deploy-ec2-infrastructure

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate Monitoring Stack
        run: |
          aws cloudformation validate-template \
            --template-body "file://cloudformation/Event _Monitoring _Stack.yaml"

      - name: Verify Dashboard Name
        run: |
          echo "Commit:"
          git rev-parse HEAD

          echo "Dashboard name in template:"
          grep "DashboardName:" "cloudformation/Event _Monitoring _Stack.yaml"

      - name: Deploy Monitoring Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-monitoring-${{ inputs.environment }} \
            --template-file "cloudformation/Event _Monitoring _Stack.yaml" \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              NotificationEmail="${{ secrets.NOTIFICATION_EMAIL }}" \
            --no-fail-on-empty-changeset


  # ==================================================
  # EC2 DASHBOARD APPLICATION - MILESTONE 5
  # ==================================================

  deploy-ec2-dashboard:
    name: Deploy EC2 Dashboard Application
    runs-on: ubuntu-latest
    needs: deploy-monitoring

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ------------------------------------------------
      # Get EC2 Instance ID from CloudFormation
      # ------------------------------------------------

      - name: Get Dashboard EC2 Instance ID
        id: get-ec2-id
        run: |

          EC2_INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-ec2-dashboard-${{ inputs.environment }} \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardEC2InstanceId'].OutputValue" \
            --output text)

          echo "EC2 Instance ID: $EC2_INSTANCE_ID"

          echo "EC2_INSTANCE_ID=$EC2_INSTANCE_ID" >> "$GITHUB_ENV"

      # ------------------------------------------------
      # Wait for EC2 SSM availability
      # ------------------------------------------------

      - name: Wait for EC2 SSM
        run: |

          echo "Waiting for EC2 instance to become available through SSM..."

          for i in {1..30}; do

            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "EC2 is online in SSM."
              exit 0
            fi

            sleep 10

          done

          echo "EC2 did not become available through SSM."
          exit 1

      # ------------------------------------------------
      # Deploy Dashboard Application
      # ------------------------------------------------

      - name: Deploy Dashboard to EC2
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p /opt/cloudmart-dashboard/templates",
              "curl -L -o /opt/cloudmart-dashboard/app.py https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/dashboard/app.py",
              "curl -L -o /opt/cloudmart-dashboard/templates/dashboard.html https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/dashboard/templates/dashboard.html",
              "curl -L -o /opt/cloudmart-dashboard/templates/login.html https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/dashboard/templates/login.html",
              "chown -R ec2-user:ec2-user /opt/cloudmart-dashboard",
              "systemctl restart cloudmart-dashboard",
              "systemctl restart nginx",
              "systemctl is-active cloudmart-dashboard",
              "systemctl is-active nginx"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
